<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="emerald">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مكاتب التوديع والشحن في العراق 🇮🇶</title>

    <!-- DaisyUI & Tailwind CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- FontAwesome 6 Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

    <!-- Google Fonts: Readex Pro -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#047857">

    <style>
        * { font-family: 'Readex Pro', system-ui, sans-serif; }
    </style>
</head>
<body class="bg-base-200 min-h-screen text-base-content flex flex-col justify-between">

    <div class="max-w-3xl mx-auto w-full p-3 sm:p-4 flex-1">
        
        <!-- Header Top Bar -->
        <header class="navbar bg-gradient-to-r from-emerald-800 to-teal-700 text-white rounded-2xl shadow-xl mb-4 px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="p-2.5 rounded-xl bg-white/10 text-amber-300">
                    <i class="fa-solid fa-truck-fast text-2xl"></i>
                </div>
                <div>
                    <h1 class="text-lg sm:text-xl font-bold tracking-tight">مكاتب التوديع في العراق 🇮🇶</h1>
                    <p class="text-[11px] opacity-90">دليلك السريع لمكاتب وفروع التوديع في كافة المحافظات</p>
                </div>
            </div>

            <!-- Toggle Filter Button -->
            <button id="btn-toggle-filter" class="btn btn-circle btn-ghost text-white text-lg hover:bg-white/10" title="تصفية وبحث">
                <i class="fa-solid fa-filter"></i>
            </button>
        </header>

        <!-- Hidden Filter & Search Box -->
        <div id="filter-panel" class="hidden card bg-base-100 shadow-md border border-base-300 mb-4 transition-all">
            <div class="card-body p-4 gap-3">
                <div class="form-control w-full">
                    <div class="relative">
                        <input type="text" id="search-input" placeholder="ابحث باسم المكتب، المحافظة، أو المنطقة..." class="input input-bordered w-full pr-9 text-sm focus:input-primary" />
                        <span class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none text-base-content/40">
                            <i class="fa-solid fa-magnifying-glass"></i>
                        </span>
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div class="form-control w-full">
                        <label class="label py-1"><span class="label-text font-bold text-xs">تصفية حسب المحافظة</span></label>
                        <select id="governorate-filter" class="select select-bordered select-sm w-full text-xs">
                            <option value="الكل">كل المحافظات</option>
                            <option value="بغداد - الكرخ">بغداد - الكرخ</option>
                            <option value="بغداد - الرصافة">بغداد - الرصافة</option>
                            <option value="البصرة">البصرة</option>
                            <option value="نينوى (الموصل)">نينوى (الموصل)</option>
                            <option value="أربيل">أربيل</option>
                            <option value="النجف الأشرف">النجف الأشرف</option>
                            <option value="كربلاء المقدسة">كربلاء المقدسة</option>
                            <option value="بابل (الحلة)">بابل (الحلة)</option>
                            <option value="واسط (الكوت)">واسط (الكوت)</option>
                            <option value="ديالي (بعقوبة)">ديالي (بعقوبة)</option>
                            <option value="ذي قار (الناصرية)">ذي قار (الناصرية)</option>
                            <option value="القادسية (الديوانية)">القادسية (الديوانية)</option>
                            <option value="ميسان (العمارة)">ميسان (العمارة)</option>
                            <option value="المثنى (السماوة)">المثنى (السماوة)</option>
                            <option value="الأنبار (الرمادي)">الأنبار (الرمادي)</option>
                            <option value="صلاح الدين (تكريت)">صلاح الدين (تكريت)</option>
                            <option value="السليمانية">السليمانية</option>
                            <option value="دهوك">دهوك</option>
                            <option value="كركوك">كركوك</option>
                        </select>
                    </div>

                    <div class="form-control w-full">
                        <label class="label py-1"><span class="label-text font-bold text-xs">ترتيب المكاتب</span></label>
                        <select id="sort-order" class="select select-bordered select-sm w-full text-xs">
                            <option value="default">الترتيب الافتراضي</option>
                            <option value="name-asc">حسب الاسم (أ - ي)</option>
                            <option value="name-desc">حسب الاسم (ي - أ)</option>
                            <option value="governorate">حسب المحافظة والمنطقة</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <!-- Offices Grid List -->
        <main>
            <div id="offices-container" class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
                <div class="col-span-full text-center py-12">
                    <span class="loading loading-spinner loading-lg text-primary"></span>
                    <p class="text-xs text-base-content/60 mt-2 font-semibold">جاري تحضير مكاتب التوديع في المحافظات...</p>
                </div>
            </div>
        </main>
    </div>

    <!-- Responsive Footer -->
    <footer class="footer footer-center p-4 bg-base-100 text-base-content border-t border-base-300 text-xs mt-6">
        <aside>
            <p class="font-semibold text-emerald-800">خدمة خيرية مجانية لمساعدة سائقي التوصيل في العراق 🇮🇶</p>
            <p class="text-[11px] text-base-content/50 mt-0.5">Delivery Offices Iraq • PWA Ready</p>
        </aside>
    </footer>

    <!-- Driver Report Modal Dialog -->
    <dialog id="report-modal-dialog" class="modal modal-bottom sm:modal-middle">
        <div class="modal-box">
            <h3 class="font-bold text-base mb-2 text-error flex items-center gap-2">
                <i class="fa-solid fa-triangle-exclamation"></i> إرسال تبليغ حول مكتب توديع
            </h3>
            <input type="hidden" id="report-office-id" value="">
            <input type="hidden" id="report-office-name" value="">

            <div class="form-control w-full mb-3">
                <label class="label py-1"><span class="label-text font-bold text-xs">نوع المشكلة أو التبليغ</span></label>
                <select id="report-type" class="select select-bordered select-sm w-full text-xs">
                    <option value="المكتب مغلق">المكتب مغلق حالياً / مغير أوقاته</option>
                    <option value="الموقع غير دقيق">موقع الخريطة غير دقيق</option>
                    <option value="رقم الهاتف لا يعمل">رقم الهاتف مغلق أو لا يعمل</option>
                    <option value="معلومات غير صحيحة">معلومات أو اسم المكتب غير صحيح</option>
                    <option value="أخرى">ملاحظة أخرى</option>
                </select>
            </div>

            <div class="form-control w-full mb-4">
                <label class="label py-1"><span class="label-text font-bold text-xs">تفاصيل إضافية (اختياري)</span></label>
                <textarea id="report-note" rows="3" placeholder="اكتب تفاصيل إضافية..." class="textarea textarea-bordered text-xs"></textarea>
            </div>

            <div class="modal-action flex gap-2">
                <button id="btn-submit-report" class="btn btn-error text-white flex-1 font-bold text-xs gap-1">
                    <i class="fa-solid fa-paper-plane"></i> إرسال البلاغ
                </button>
                <form method="dialog">
                    <button class="btn btn-ghost text-xs">إلغاء</button>
                </form>
            </div>
        </div>
    </dialog>

    <!-- Firebase JS SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAm2AwTBllo5kDgMzX7h_aFdJ-2CGu1MN4",
            authDomain: "deliveryoffices.firebaseapp.com",
            projectId: "deliveryoffices",
            storageBucket: "deliveryoffices.firebasestorage.app",
            messagingSenderId: "223751480716",
            appId: "1:223751480716:web:9c705773d53f6e896322a9"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let officesList = [];

        // Toggle Filter Box Button
        document.getElementById('btn-toggle-filter').addEventListener('click', () => {
            const filterPanel = document.getElementById('filter-panel');
            filterPanel.classList.toggle('hidden');
        });

        // Load Offices from Firestore
        async function fetchOffices() {
            const container = document.getElementById('offices-container');
            try {
                const snapshot = await getDocs(collection(db, "offices"));
                officesList = [];
                snapshot.forEach(doc => {
                    const data = doc.data();
                    data.id = doc.id;
                    officesList.push(data);
                });
                renderOffices();
            } catch (err) {
                console.error("Fetch error:", err);
                container.innerHTML = `
                    <div class="col-span-full alert alert-warning text-xs">
                        <i class="fa-solid fa-triangle-exclamation"></i>
                        <span>جاري العمل بالوضع الاحتياطي... تعذر الاتصال بـ Firebase.</span>
                    </div>
                `;
            }
        }

        function renderOffices() {
            const container = document.getElementById('offices-container');
            const searchVal = document.getElementById('search-input').value.trim().toLowerCase();
            const govVal = document.getElementById('governorate-filter').value;
            const sortVal = document.getElementById('sort-order').value;

            let filtered = officesList.filter(off => {
                const matchGov = (govVal === 'الكل') || (off.governorate === govVal);
                const matchSearch = !searchVal || 
                    (off.name && off.name.toLowerCase().includes(searchVal)) ||
                    (off.governorate && off.governorate.toLowerCase().includes(searchVal)) ||
                    (off.district && off.district.toLowerCase().includes(searchVal));

                return matchGov && matchSearch;
            });

            if (sortVal === 'name-asc') {
                filtered.sort((a, b) => (a.name || '').localeCompare(b.name || '', 'ar'));
            } else if (sortVal === 'name-desc') {
                filtered.sort((a, b) => (b.name || '').localeCompare(a.name || '', 'ar'));
            } else if (sortVal === 'governorate') {
                filtered.sort((a, b) => (a.governorate || '').localeCompare(b.governorate || '', 'ar'));
            }

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full text-center py-10 bg-base-100 rounded-2xl border border-base-300 p-6">
                        <i class="fa-solid fa-store-slash text-4xl text-base-content/30 mb-2"></i>
                        <p class="font-bold text-sm text-base-content/80">لم يتم العثور على مكاتب مطابقة للبحث.</p>
                        <p class="text-xs text-base-content/50 mt-1">جرب اختيار محافظة أخرى أو مسح شريط البحث.</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = '';
            filtered.forEach(off => {
                const card = document.createElement('div');
                card.className = "card bg-base-100 shadow-md border border-base-300 hover:shadow-lg transition-shadow";

                const phoneNum = off.phone || off.officeNumber;
                const mapLink = off.mapUrl || (off.lat && off.lng ? `https://www.google.com/maps?q=${off.lat},${off.lng}` : null);

                card.innerHTML = `
                    <div class="card-body p-4 gap-2.5">
                        <div class="flex justify-between items-start">
                            <div>
                                <h3 class="font-bold text-base text-base-content flex items-center gap-1.5">
                                    <i class="fa-solid fa-building text-emerald-600 text-sm"></i>
                                    ${escapeHtml(off.name)}
                                </h3>
                                <p class="text-xs text-base-content/70 mt-1">
                                    📍 <strong class="text-emerald-700 font-semibold">${escapeHtml(off.governorate)}</strong> ${off.district ? '- ' + escapeHtml(off.district) : ''}
                                </p>
                            </div>
                            <button class="btn btn-ghost btn-xs text-error gap-1 btn-report" title="إرسال تبليغ">
                                <i class="fa-solid fa-flag"></i>
                            </button>
                        </div>

                        <div class="flex items-center gap-3 text-xs text-base-content/80 bg-base-200/50 p-2 rounded-lg">
                            <span>⏰ الفتح: <strong>${escapeHtml(off.openTime || '08:00')}</strong></span>
                            <span>•</span>
                            <span>الإغلاق: <strong>${escapeHtml(off.closeTime || '22:00')}</strong></span>
                        </div>

                        ${off.desc ? `<p class="text-xs text-base-content/70 leading-relaxed bg-emerald-50/50 p-2 rounded border border-emerald-100">${escapeHtml(off.desc)}</p>` : ''}

                        <div class="flex gap-2 mt-1">
                            ${mapLink ? `
                                <a href="${escapeHtml(mapLink)}" target="_blank" class="btn btn-primary btn-sm text-white flex-1 font-bold gap-1 text-xs shadow-sm">
                                    <i class="fa-solid fa-map-location-dot"></i> فتح الخريطة
                                </a>
                            ` : ''}

                            ${phoneNum ? `
                                <a href="tel:${escapeHtml(phoneNum)}" class="btn btn-outline btn-success btn-sm gap-1 text-xs font-bold">
                                    <i class="fa-solid fa-phone"></i> اتصل
                                </a>
                            ` : ''}
                        </div>
                    </div>
                `;

                card.querySelector('.btn-report').onclick = () => openReportModal(off);
                container.appendChild(card);
            });
        }

        function openReportModal(office) {
            document.getElementById('report-office-id').value = office.id;
            document.getElementById('report-office-name').value = office.name;
            document.getElementById('report-modal-dialog').showModal();
        }

        document.getElementById('btn-submit-report').addEventListener('click', async () => {
            const officeId = document.getElementById('report-office-id').value;
            const officeName = document.getElementById('report-office-name').value;
            const reportType = document.getElementById('report-type').value;
            const note = document.getElementById('report-note').value.trim();

            try {
                await addDoc(collection(db, "reports"), {
                    officeId,
                    officeName,
                    reportType,
                    note,
                    timestamp: Date.now()
                });
                document.getElementById('report-modal-dialog').close();
                document.getElementById('report-note').value = '';
                alert("شكراً لك! تم إرسال البلاغ وسيقوم المشرفون بمراجعته. 🛡️");
            } catch (err) {
                alert("حدث خطأ أثناء إرسال البلاغ.");
            }
        });

        document.getElementById('search-input').addEventListener('input', renderOffices);
        document.getElementById('governorate-filter').addEventListener('change', renderOffices);
        document.getElementById('sort-order').addEventListener('change', renderOffices);

        fetchOffices();

        // PWA Service Worker Registration
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(err => console.log('SW registration error:', err));
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }
    </script>
</body>
</html>
